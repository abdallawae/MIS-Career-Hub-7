<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الشهادة | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="certificates.html">الشهادات</a><a href="account.html">حسابي</a></nav></div></header><main class="section"><div class="wrap"><div class="hero"><span class="eyebrow">CERTIFICATE VERIFICATION</span><h1>التحقق من الشهادة 🔎</h1><p class="muted">أي شخص يقدر يدخل رقم الشهادة ويتأكد من بياناتها.</p></div><div class="card verify-box"><label for="certificateId">رقم الشهادة</label><input id="certificateId" class="search" placeholder="MISH-2026-XXXXXXXX-SQL" autocomplete="off"><button id="verifyBtn" class="btn">تحقق من الشهادة</button><div id="result" style="margin-top:20px"></div></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script src="assets/app.js"></script><script>const names={'sql':'SQL وقواعد البيانات','excel':'Excel الاحترافي','power-bi':'Power BI','systems-analysis':'تحليل وتصميم النظم','erp':'ERP','python':'Python وتحليل البيانات','web':'تطوير الويب','cybersecurity':'الأمن السيبراني','cloud':'الحوسبة السحابية','project-management':'إدارة المشروعات','career':'المسار الوظيفي','digital-transformation':'التحول الرقمي'};const result=document.getElementById('result'),input=document.getElementById('certificateId');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}async function verify(){const id=input.value.trim().toUpperCase();if(!id){result.innerHTML='<p>اكتب رقم الشهادة أولاً.</p>';return;}result.innerHTML='<p class="muted">جاري التحقق...</p>';try{const {data,error}=await MIS.verifyCertificate(id);if(error)throw new Error(error);if(!data){result.innerHTML='<div class="card"><h2>❌ الشهادة غير موجودة أو غير صالحة</h2><p class="muted">تأكد من رقم الشهادة. الشهادة لا تظهر في التحقق العام إلا إذا كانت صادرة وحالتها سارية.</p></div>';return;}result.innerHTML=`<div class="card"><h2>✅ شهادة أصلية وسارية</h2><p><strong>اسم الطالب:</strong> ${esc(data.student_name)}</p><p><strong>المسار:</strong> ${esc(names[data.course_slug]||data.course_slug)}</p><p><strong>تاريخ الإصدار:</strong> ${data.issued_at?new Date(data.issued_at).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}):'—'}</p><p><strong>Certificate ID:</strong> <span dir="ltr">${esc(data.certificate_id)}</span></p><div style="margin-top:16px"><span class="pill success">ISSUED ✓</span></div></div>`}catch(e){console.error(e);result.innerHTML='<div class="card"><h2>⚠️ تعذر الاتصال بنظام التحقق</h2><p class="muted">تأكد من تشغيل ملف certificates.sql في Supabase ثم أعد المحاولة.</p></div>'}}document.getElementById('verifyBtn').onclick=verify;input.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});const preset=new URLSearchParams(location.search).get('id');if(preset){input.value=preset;verify()}</script></body></html>
