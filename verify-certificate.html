<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الشهادة | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="certificates.html">الشهادات</a><a href="account.html">حسابي</a></nav></div></header><main class="section"><div class="wrap"><div class="hero"><span class="eyebrow">CERTIFICATE VERIFICATION</span><h1>التحقق من الشهادة 🔎</h1><p class="muted">أدخل رقم الشهادة للتأكد من بياناتها.</p></div><div class="card verify-box"><label for="certificateId">رقم الشهادة</label><input id="certificateId" class="search" placeholder="مثال: MISH-2026-000001" autocomplete="off"><button id="verifyBtn" class="btn">تحقق من الشهادة</button><div id="result" style="margin-top:20px"></div></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script src="assets/app.js"></script><script>const result=document.getElementById('result'),input=document.getElementById('certificateId');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}document.getElementById('verifyBtn').onclick=async()=>{const id=input.value.trim().toUpperCase();if(!id){result.innerHTML='<p>اكتب رقم الشهادة أولاً.</p>';return;}result.innerHTML='<p class="muted">جاري التحقق...</p>';try{const {data,error}=await sb.from('certificates').select('certificate_id,student_name,course_slug,issued_at').eq('certificate_id',id).maybeSingle();if(error)throw error;if(!data){result.innerHTML='<div class="card"><h2>❌ الشهادة غير موجودة</h2><p class="muted">تأكد من رقم الشهادة المدخل.</p></div>';return;}result.innerHTML=`<div class="card"><h2>✅ شهادة أصلية</h2><p><strong>اسم الطالب:</strong> ${esc(data.student_name)}</p><p><strong>المسار:</strong> ${esc(data.course_slug)}</p><p><strong>تاريخ الإتمام:</strong> ${data.issued_at?new Date(data.issued_at).toLocaleDateString('ar-EG'):'—'}</p><p><strong>Certificate ID:</strong> ${esc(data.certificate_id)}</p></div>`}catch(e){console.error(e);result.innerHTML='<div class="card"><h2>⚠️ تعذر التحقق</h2><p class="muted">نظام التحقق يحتاج جدول certificates في Supabase قبل تفعيله بالكامل.</p></div>'}};</script></body></html>
