<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشهادات | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="account.html">حسابي</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap"><div class="hero"><span class="eyebrow">CERTIFICATES</span><h1>شهاداتي 🏆</h1><p class="muted">هنا هتظهر شهادات إتمام المسارات بعد إكمال جميع دروس المسار.</p></div><div id="certState" class="card">جاري التحقق من الحساب...</div><div id="certGrid" class="grid" style="margin-top:22px"></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script src="assets/app.js"></script><script>const slugs=['sql','excel','power-bi','systems-analysis','erp','python','web','cybersecurity','cloud','project-management','career','digital-transformation'];const names={'sql':'SQL وقواعد البيانات','excel':'Excel الاحترافي','power-bi':'Power BI','systems-analysis':'تحليل وتصميم النظم','erp':'ERP','python':'Python وتحليل البيانات','web':'تطوير الويب','cybersecurity':'الأمن السيبراني','cloud':'الحوسبة السحابية','project-management':'إدارة المشروعات','career':'المسار الوظيفي','digital-transformation':'التحول الرقمي'};async function init(){const user=await MIS.user();if(!user){certState.innerHTML='<h2>🔐 سجّل الدخول أولاً</h2><p class="muted">لازم تكون مسجل دخول علشان نعرض شهاداتك.</p><a class="btn" href="auth.html?next=certificates.html">تسجيل الدخول</a>';return}certState.innerHTML='<h2>🎓 سجل الشهادات</h2><p class="muted">بنحسب الإتمام الحقيقي من قاعدة البيانات.</p>';const cards=await Promise.all(slugs.map(async s=>{const p=await MIS.getProgress(s),done=p.length,complete=done===60;return `<div class="card"><div class="course-top"><span class="course-icon">${complete?'🏆':'📘'}</span><span class="pill">${complete?'مكتملة':'قيد التقدم'}</span></div><h3>${names[s]}</h3><p class="muted">${done} من 60 درس مكتمل</p><div class="progress"><span style="width:${Math.min(100,done/60*100)}%"></span></div>${complete?'<p><strong>🎉 مبروك! أكملت المسار بالكامل.</strong></p><button class="btn" onclick="window.print()">طباعة الشهادة</button>':'<a class="btn secondary" href="course.html?course='+s+'">إكمال المسار</a>'}</div>`}));certGrid.innerHTML=cards.join('')}init();</script></body></html>
