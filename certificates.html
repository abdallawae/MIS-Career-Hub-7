<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشهادات | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="account.html">حسابي</a><a href="certificates.html">شهاداتي</a><a href="projects.html">المشاريع</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap"><div class="hero"><span class="eyebrow">CERTIFICATES</span><h1>شهاداتي 🏆</h1><p class="muted">الشهادة بتتفتح تلقائيًا بعد إكمال 60 درسًا في المسار، وبتتسجل برقم شهادة وتاريخ إصدار ثابتين.</p></div><div id="certState" class="card">جاري التحقق من الحساب...</div><div id="certGrid" class="grid" style="margin-top:22px"></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script src="assets/app.js"></script><script>const slugs=['sql','excel','power-bi','systems-analysis','erp','python','web','cybersecurity','cloud','project-management','career','digital-transformation'];const names={'sql':'SQL وقواعد البيانات','excel':'Excel الاحترافي','power-bi':'Power BI','systems-analysis':'تحليل وتصميم النظم','erp':'ERP','python':'Python وتحليل البيانات','web':'تطوير الويب','cybersecurity':'الأمن السيبراني','cloud':'الحوسبة السحابية','project-management':'إدارة المشروعات','career':'المسار الوظيفي','digital-transformation':'التحول الرقمي'};async function init(){const user=await MIS.user();if(!user){certState.innerHTML='<h2>🔐 سجّل الدخول أولاً</h2><p class="muted">لازم تكون مسجل دخول علشان تعرض شهاداتك.</p><a class="btn" href="auth.html?next=certificates.html">تسجيل الدخول</a>';return}certState.innerHTML='<h2>🎓 شهاداتك الرقمية</h2><p class="muted">كل شهادة مرتبطة بحسابك، ولا يتم إصدارها إلا بعد إكمال 60 درسًا.</p>';const profile=await MIS.profile();const studentName=profile?.full_name||user.user_metadata?.full_name||user.email?.split('@')[0]||'طالب';const cards=await Promise.all(slugs.map(async s=>{const p=await MIS.getProgress(s),done=p.length,pct=Math.round(done/60*100),complete=done>=60;let cert=null,issueError=null;if(complete){cert=await MIS.getCertificate(s);if(!cert){const issued=await MIS.issueCertificate(s,studentName);cert=issued.data;issueError=issued.error}}return `<div class="card"><div class="course-top"><span class="course-icon">${complete?'🏆':'📘'}</span><span class="pill">${complete?'مؤهلة للشهادة':pct+'%'}</span></div><h3>${names[s]}</h3><p class="muted">${done} من 60 درس مكتمل</p><div class="progress"><span style="width:${Math.min(100,pct)}%"></span></div>${complete&&cert?'<p><strong>🎉 الشهادة صادرة وسارية.</strong></p><p class="muted" dir="ltr">'+cert.certificate_id+'</p><a class="btn" href="certificate.html?course='+encodeURIComponent(s)+'">عرض الشهادة 🏆</a> <a class="btn secondary" href="verify-certificate.html?id='+encodeURIComponent(cert.certificate_id)+'">تحقق</a>':complete?'<p class="muted">تعذر إصدار الشهادة حاليًا: '+(issueError||'خطأ غير معروف')+'</p>':'<a class="btn secondary" href="course.html?course='+encodeURIComponent(s)+'">إكمال المسار</a>'}</div>`}));certGrid.innerHTML=cards.join('')}init();</script></body></html>
