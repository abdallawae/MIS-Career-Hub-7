<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات الـPortfolio | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><style>.wrapx{max-width:900px;margin:auto;padding:35px 18px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field textarea{border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}.field textarea{min-height:120px;resize:vertical}.help{font-size:13px;color:#64748b}.status{padding:13px;border-radius:12px;margin-bottom:16px}.ok{background:#ecfdf5;color:#166534}.bad{background:#fef2f2;color:#991b1b}.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:18px;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.publish-state{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f1f5f9;font-size:13px}@media(max-width:600px){.actions .btn{width:100%;justify-content:center}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a></div></header><main class="wrapx"><section id="state" class="card">⚡ جاري تحميل إعدادات الـPortfolio...</section><div id="app" style="display:none"><section class="card"><div class="kicker">🌐 PUBLIC PORTFOLIO</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h1>إعدادات ملفك المهني</h1><span id="publishState" class="publish-state">غير منشور</span></div><p class="help">اكتب فقط المعلومات التي تريد ظهورها للعامة. لا تضع كلمة مرور أو أي مفتاح سري هنا.</p><div id="msg"></div><div class="form-grid"><label class="field"><span>الاسم الظاهر</span><input id="display_name" maxlength="100"></label><label class="field"><span>العنوان المهني</span><input id="headline" maxlength="140" placeholder="طالب MIS | Data & Business Technology"></label><label class="field"><span>رابط الصورة الشخصية</span><input id="avatar_url" placeholder="https://..." type="url"><small class="help">اختياري — استخدم رابط صورة عامة فقط.</small></label><label class="field"><span>الرابط العام المختصر</span><input id="slug" maxlength="49" placeholder="abdallah-wael"><small class="help">حروف إنجليزية صغيرة وأرقام وشرطة فقط.</small></label><label class="field"><span>رابط LinkedIn</span><input id="linkedin_url" placeholder="https://www.linkedin.com/in/..." type="url"></label><label class="field"><span>رابط GitHub</span><input id="github_url" placeholder="https://github.com/..." type="url"></label><label class="field"><span>رابط موقع شخصي</span><input id="website_url" placeholder="https://..." type="url"></label><label class="field full"><span>نبذة مهنية</span><textarea id="bio" maxlength="700"></textarea></label><label class="field full"><span>المهارات</span><textarea id="skills" placeholder="مثال: SQL | متوسط\nExcel | متقدم\nPower BI | مبتدئ"></textarea><small class="help">كل سطر = مهارة | المستوى</small></label><label class="field full"><span>المشاريع</span><textarea id="projects" placeholder="مثال: Dashboard مبيعات | تحليل بيانات المبيعات باستخدام Power BI | https://example.com"></textarea><small class="help">كل سطر = اسم المشروع | وصف المشروع | الرابط الاختياري</small></label></div><div class="actions"><button class="btn" id="save">💾 حفظ التعديلات</button><button class="btn secondary" id="publish">🌐 نشر الـPortfolio</button><button class="btn secondary" id="unpublish">🔒 إخفاء الـPortfolio</button><a class="btn secondary" id="open" target="_blank" style="display:none">فتح الـPortfolio العام ↗</a></div><div class="preview"><strong>رابط المشاركة:</strong><div id="url" class="help" style="margin-top:7px">—</div></div></section></div></main><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script><script>let user,profile;const $=id=>document.getElementById(id);const msg=(text,ok=true)=>{$('msg').innerHTML=`<div class="status ${ok?'ok':'bad'}">${text}</div>`};function parseSkills(text){return text.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [name,level='']=line.split('|').map(x=>x.trim());return {name,level}})}function parseProjects(text){return text.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [title,description='',url='']=line.split('|').map(x=>x.trim());return {title,description,url}})}function skillsText(a){return (Array.isArray(a)?a:[]).map(x=>typeof x==='string'?x:`${x.name||''}${x.level?' | '+x.level:''}`).join('\n')}function projectsText(a){return (Array.isArray(a)?a:[]).map(x=>typeof x==='string'?x:`${x.title||''}${x.description?' | '+x.description:''}${x.url?' | '+x.url:''}`).join('\n')}function renderState(){if(!profile)return;$('publishState').textContent=profile.public_enabled?'✓ منشور للعامة':'🔒 غير منشور'}async function init(){user=await MIS.user();if(!user){location.replace('auth.html?mode=login&next='+encodeURIComponent('portfolio-settings.html'));return}const r=await sb.rpc('ensure_my_portfolio');if(r.error)throw r.error;profile=r.data;Object.keys(profile).forEach(k=>{if($(k))$(k).value=profile[k]??''});$('skills').value=skillsText(profile.skills);$('projects').value=projectsText(profile.projects);updateLink();renderState();$('state').style.display='none';$('app').style.display='block';$('save').onclick=save;$('publish').onclick=()=>save(true);$('unpublish').onclick=()=>toggle(false)}async function save(publish=null){const slug=$('slug').value.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9-]{2,48}$/.test(slug))return msg('الرابط المختصر غير صالح. استخدم 3 إلى 49 حرفًا إنجليزيًا صغيرًا/أرقامًا/شرطة.',false);const payload={user_id:user.id,public_slug:slug,display_name:$('display_name').value.trim()||'طالب MIS',headline:$('headline').value.trim()||'طالب نظم معلومات إدارية',bio:$('bio').value.trim()||'طالب نظم معلومات إدارية يهتم بالتعلم العملي.',avatar_url:$('avatar_url').value.trim()||null,linkedin_url:$('linkedin_url').value.trim()||null,github_url:$('github_url').value.trim()||null,website_url:$('website_url').value.trim()||null,skills:parseSkills($('skills').value),projects:parseProjects($('projects').value),public_enabled:publish===null?!!profile.public_enabled:publish};const r=await sb.from('portfolio_profiles').upsert(payload,{onConflict:'user_id'}).select().single();if(r.error){if(r.error.code==='23505')return msg('الرابط المختصر مستخدم بالفعل. اختر رابطًا آخر.',false);return msg(r.error.message,false)}profile=r.data;updateLink();renderState();msg(profile.public_enabled?'تم حفظ ونشر الـPortfolio بنجاح 🚀':'تم حفظ التعديلات بنجاح.');$('open').style.display=profile.public_enabled?'inline-flex':'none'}async function toggle(enabled){const r=await sb.from('portfolio_profiles').update({public_enabled:enabled}).eq('user_id',user.id).select().single();if(r.error)return msg(r.error.message,false);profile=r.data;updateLink();renderState();$('open').style.display=enabled?'inline-flex':'none';msg(enabled?'تم نشر الـPortfolio.':'تم إخفاء الـPortfolio.')}function updateLink(){if(!profile)return;const u=new URL('public-portfolio.html',location.href);u.searchParams.set('u',profile.public_slug);$('url').textContent=u.href;$('open').href=u.href}init().catch(e=>{console.error(e);$('state').innerHTML='<h2>تعذر تحميل الإعدادات</h2><p class="help">شغّل SQL الخاص بالـPortfolio العام في Supabase ثم أعد المحاولة.</p>'});</script></body></html>
