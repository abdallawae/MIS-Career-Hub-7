<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسار | MIS Career Hub</title><meta name="description" content="مسار تعليمي تفاعلي داخل MIS Career Hub"><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src="assets/supabase-client.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="account.html">حسابي</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap" id="app"><section id="gate" class="hero" hidden><span class="eyebrow">🔐 دخول مطلوب</span><h1>سجّل حسابك أولاً</h1><p class="muted">لازم تسجّل الدخول قبل بدء أي مسار، علشان نحفظ تقدمك ونتائج الاختبارات على حسابك.</p><a class="btn" id="loginLink" href="auth.html">تسجيل الدخول / إنشاء حساب</a></section><section id="courseApp" hidden><section class="hero"><span class="eyebrow">📚 مسار تعليمي</span><h1 id="title">جاري تحميل المسار...</h1><p class="muted" id="desc"></p><div class="stat-grid"><div class="stat"><strong>10</strong><span>مستويات</span></div><div class="stat"><strong>60</strong><span>درس</span></div><div class="stat"><strong id="done">0%</strong><span>تقدمك</span></div><div class="stat"><strong>🏆</strong><span>مشروع نهائي</span></div></div><p id="loginHint" class="muted"></p></section><div id="levels"></div></section></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script>const C={sql:['SQL وقواعد البيانات','ابنِ قواعد بيانات حقيقية وتعلم الاستعلامات والتحليل.'],excel:['Excel الاحترافي','الدوال والتنظيف وPivotTables ولوحات التحكم.'],'power-bi':['Power BI','حوّل البيانات إلى تقارير تفاعلية وقرارات مبنية على الأرقام.'],'systems-analysis':['تحليل وتصميم النظم','المتطلبات وUML وSDLC وتصميم الحلول.'],erp:['ERP','افهم عمليات الشركات وأنظمة ERP وربط الأقسام.'],python:['Python وتحليل البيانات','Python وPandas وتنظيف وتحليل البيانات.'],web:['تطوير الويب','HTML وCSS وJavaScript وبناء تطبيقات ويب.'],cybersecurity:['الأمن السيبراني','الحماية والمخاطر والشبكات والوعي الأمني.'],cloud:['الحوسبة السحابية','مفاهيم السحابة والبنية والخدمات والتطبيقات.'],'project-management':['إدارة المشروعات','التخطيط والتنفيذ والمتابعة وAgile.'],career:['المسار الوظيفي','CV وLinkedIn وPortfolio والمقابلات.'],'digital-transformation':['التحول الرقمي','الاستراتيجية والأتمتة والبيانات وإدارة التغيير.']};const qs=new URLSearchParams(location.search),slug=qs.get('course')||'sql',d=C[slug]||C.sql;document.title=d[0]+' | MIS Career Hub';const names=['الأساسيات وبناء الصورة الكبيرة','المفاهيم والأدوات','التطبيقات الأساسية','حل المشكلات','المهارات المتوسطة','مشروعات مصغرة','التطبيق الاحترافي','سيناريوهات سوق العمل','المشروع المتكامل','المشروع النهائي والجاهزية الوظيفية'];const lessonNames=['فهم المفاهيم الأساسية','التعامل مع الأدوات والواجهة','خطوات العمل من الصفر','تطبيق عملي على مثال واقعي','أخطاء شائعة وكيف تتجنبها','تحدي عملي ومراجعة المستوى'];let completed=[];function render(){document.getElementById('done').textContent=Math.round(completed.length/60*100)+'%';document.getElementById('levels').innerHTML=names.map((n,l)=>`<section class="level"><h2>المستوى ${l+1}: ${n}</h2><div class="lessons">${lessonNames.map((n,i)=>{const ok=completed.some(x=>Number(x.level_number)==l+1&&Number(x.lesson_number)==i+1);return `<a class="lesson" href="lesson.html?course=${encodeURIComponent(slug)}&level=${l+1}&lesson=${i+1}"><small>${ok?'✅ مكتمل':'الدرس '+(i+1)}</small><strong>${n} — ${d[0]}</strong><span class="muted">${ok?'تم الإنجاز':'فتح الدرس ←'}</span></a>`}).join('')}</div></section>`).join('')}async function load(){const user=await MIS.user();if(!user){document.getElementById('gate').hidden=false;document.getElementById('loginLink').href=`auth.html?next=${encodeURIComponent(location.pathname+location.search)}`;return;}document.getElementById('courseApp').hidden=false;completed=await MIS.getProgress(slug);await MIS.enroll(slug);document.getElementById('title').textContent=d[0];document.getElementById('desc').textContent=d[1];document.getElementById('loginHint').textContent='تم تسجيل المسار وحفظ تقدمك على حسابك ✓';render()}load();document.querySelector('[data-year]').textContent=new Date().getFullYear();</script></body></html>
