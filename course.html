<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسار | MIS Career Hub</title><meta name="description" content="صفحة مسار تعليمية تفاعلية داخل MIS Career Hub"><link rel="stylesheet" href="assets/app.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="auth.html">حسابي</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap" id="app"><section class="hero"><span class="eyebrow">📚 مسار تعليمي</span><h1 id="title">جاري تحميل المسار...</h1><p class="muted" id="desc"></p><div class="stat-grid"><div class="stat"><strong>10</strong><span>مستويات</span></div><div class="stat"><strong>60</strong><span>درس</span></div><div class="stat"><strong id="done">0%</strong><span>تقدمك</span></div><div class="stat"><strong>🏆</strong><span>مشروع نهائي</span></div></div></section><div id="levels"></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script>const C={sql:['SQL وقواعد البيانات','ابنِ قواعد بيانات حقيقية وتعلم الاستعلامات والتحليل.'],excel:['Excel الاحترافي','الدوال والتنظيف وPivotTables ولوحات التحكم.'], 'power-bi':['Power BI','حوّل البيانات إلى تقارير تفاعلية وقرارات مبنية على الأرقام.'],'systems-analysis':['تحليل وتصميم النظم','المتطلبات وUML وSDLC وتصميم الحلول.'],erp:['ERP','افهم عمليات الشركات وأنظمة ERP وربط الأقسام.'],python:['Python وتحليل البيانات','Python وPandas وتنظيف وتحليل البيانات.'],web:['تطوير الويب','HTML وCSS وJavaScript وبناء تطبيقات ويب.'],cybersecurity:['الأمن السيبراني','الحماية والمخاطر والشبكات والوعي الأمني.'],cloud:['الحوسبة السحابية','مفاهيم السحابة والبنية والخدمات والتطبيقات.'],'project-management':['إدارة المشروعات','التخطيط والتنفيذ والمتابعة وAgile.'],career:['المسار الوظيفي','CV وLinkedIn وPortfolio والمقابلات.'],'digital-transformation':['التحول الرقمي','الاستراتيجية والأتمتة والبيانات وإدارة التغيير.']};const qs=new URLSearchParams(location.search),slug=qs.get('course')||'sql',d=C[slug]||C.sql;document.title=d[0]+' | MIS Career Hub';title.textContent=d[0];desc.textContent=d[1];const names=['الأساسيات وبناء الصورة الكبيرة','المفاهيم والأدوات','التطبيقات الأساسية','حل المشكلات','المهارات المتوسطة','مشروعات مصغرة','التطبيق الاحترافي','سيناريوهات سوق العمل','المشروع المتكامل','المشروع النهائي والجاهزية الوظيفية'];const lessonNames=['فهم المفاهيم الأساسية','التعامل مع الأدوات والواجهة','خطوات العمل من الصفر','تطبيق عملي على مثال واقعي','أخطاء شائعة وكيف تتجنبها','تحدي عملي ومراجعة المستوى'];const key='misch_'+slug;function p(){let x=JSON.parse(localStorage.getItem(key)||'[]');done.textContent=Math.round(x.length/60*100)+'%'}levels.innerHTML=names.map((n,l)=>`<section class="level"><h2>المستوى ${l+1}: ${n}</h2><div class="lessons">${lessonNames.map((n,i)=>`<a class="lesson" href="lesson.html?course=${slug}&level=${l+1}&lesson=${i+1}"><small>الدرس ${i+1}</small><strong>${n} — ${d[0]}</strong><span class="muted">فتح الدرس ←</span></a>`).join('')}</div></section>`).join('');p();document.querySelector('[data-year]').textContent=new Date().getFullYear();</script></body></html>
