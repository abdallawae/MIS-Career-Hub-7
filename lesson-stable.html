<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درس | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"><style>main{max-width:1050px;margin:auto}.hero,.box{padding:24px;border-radius:22px;margin-bottom:16px;background:rgba(15,23,42,.5);border:1px solid rgba(148,163,184,.18)}.hero{background:linear-gradient(135deg,#0f172a,#1e293b)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.step{padding:13px;margin:9px 0;border-right:3px solid #38bdf8;background:rgba(56,189,248,.05);border-radius:10px}.opt{display:block;margin:8px 0;padding:12px;border:1px solid rgba(148,163,184,.18);border-radius:12px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.loading{text-align:center;padding:60px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="courses.html">المسارات</a><a href="student-dashboard.html">لوحة الطالب</a><a href="auth.html">حسابي</a></nav></div></header><main class="section"><div id="loading" class="loading box"><h2>⚡ تجهيز الدرس...</h2><p>ثواني ونفتح لك المحتوى.</p></div><section id="gate" class="hero hidden"><h1>🔐 سجل دخولك لفتح الدرس</h1><p>الدخول مطلوب لحفظ تقدمك والاختبارات والشهادات.</p><a id="login" class="btn" href="auth.html">تسجيل الدخول</a><a class="btn secondary" href="auth.html?mode=signup">🆕 إنشاء حساب</a></section><div id="app" class="hidden"><section class="hero"><span id="track"></span><h1 id="title"></h1><p id="goal"></p><div id="position"></div></section><section class="box"><h2>📘 الشرح</h2><div id="explain"></div></section><section class="grid"><section class="box"><h2>🛠️ التطبيق العملي</h2><div id="practice"></div></section><section class="box"><h2>⚠️ أخطاء شائعة</h2><div id="mistakes"></div></section></section><section class="box"><h2>🔑 مصطلحات مهمة</h2><div id="terms"></div></section><section class="box"><h2>🧠 اختبار الدرس</h2><div id="quiz"></div><p id="result"></p><button id="submit" class="btn">إنهاء الاختبار</button></section><section class="box"><div class="actions"><button id="complete" class="btn" disabled>✅ إكمال الدرس</button><a id="back" class="btn secondary">↩️ العودة للمسار</a></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js?v=20260915"></script><script src="assets/supabase-client.js?v=20260915"></script><script>
(async()=>{const p=new URLSearchParams(location.search),slug=p.get('course')||'sql',level=Math.max(1,Math.min(10,+p.get('level')||1)),lesson=Math.max(1,Math.min(6,+p.get('lesson')||1));const names={sql:'SQL وقواعد البيانات',excel:'Excel الاحترافي','power-bi':'Power BI','systems-analysis':'تحليل وتصميم النظم',erp:'ERP',python:'Python وتحليل البيانات',web:'تطوير الويب',cybersecurity:'الأمن السيبراني',cloud:'الحوسبة السحابية','project-management':'إدارة المشروعات',career:'المسار الوظيفي','digital-transformation':'التحول الرقمي'};const topics={sql:['ما هي قواعد البيانات؟','الجداول والصفوف والأعمدة','DBMS وSQL','إنشاء الجداول','SELECT','WHERE'],excel:['تنظيم البيانات','الدوال الأساسية','IF','SUMIF وCOUNTIF','XLOOKUP','PivotTable'],'power-bi':['مقدمة Power BI','مصادر البيانات','Power Query','النمذجة','DAX','التقارير'],'systems-analysis':['المتطلبات','المتطلبات الوظيفية','المتطلبات غير الوظيفية','Use Case','BPMN','UAT'],erp:['Master Data','General Ledger','Accounts Receivable','Accounts Payable','Sales Order','Procure-to-Pay'],python:['Variables','if/else','for','while','Functions','Lists'],web:['HTML','CSS','Flexbox','Responsive Design','JavaScript','DOM'],cybersecurity:['CIA Triad','Threats','Vulnerabilities','Risk','MFA','Least Privilege'],cloud:['IaaS','PaaS','SaaS','Autoscaling','Load Balancing','IAM'], 'project-management':['Scope','WBS','Milestone','Critical Path','Risk Register','KPI'],career:['CV','ATS','LinkedIn','Portfolio','STAR','Networking'],'digital-transformation':['Digitization','Digitalization','Maturity','Roadmap','Automation','ROI']};const topic=(topics[slug]||topics.sql)[lesson-1];const title=`${topic} — المستوى ${level}`;const $=id=>document.getElementById(id);$('login').href='auth.html?next='+encodeURIComponent(location.pathname+location.search);$('back').href=`course.html?course=${encodeURIComponent(slug)}`;try{const {data,error}=await sb.auth.getSession();const user=data?.session?.user;if(error||!user){$('loading').classList.add('hidden');$('gate').classList.remove('hidden');return}$('track').textContent=names[slug]||slug;$('title').textContent=title;$('position').textContent=`المستوى ${level} • الدرس ${lesson} من 6`;$('goal').textContent=`بنهاية هذا الدرس ستكون قادرًا على فهم ${topic} وتطبيقه في مثال عملي مرتبط بمسار ${names[slug]||'نظم المعلومات'}.`;$('explain').innerHTML=`<p>هذا الدرس يشرح <b>${topic}</b> من الصفر بطريقة عملية. ابدأ بفهم المشكلة والهدف، ثم تعرّف على المصطلحات الأساسية، وبعدها طبّق الخطوات على مثال صغير. لا تعتمد على الحفظ فقط؛ جرّب تغيير المدخلات وراقب كيف تتغير النتيجة.</p><p>في سوق العمل، المهم أن تستطيع شرح الفكرة وتنفيذها والتحقق من النتيجة، وليس مجرد معرفة اسم الأداة.</p>`;$('practice').innerHTML=['حدد هدفًا واضحًا للتطبيق.','جهّز مثالًا صغيرًا أو بيانات بسيطة.','نفّذ الفكرة خطوة بخطوة.','غيّر قيمة أو حالة واختبر النتيجة.','اكتب ملاحظة قصيرة تشرح لماذا الحل صحيح.'].map((x,i)=>`<div class="step"><b>${i+1}.</b> ${x}</div>`).join('');$('mistakes').innerHTML=['البدء بالأداة قبل فهم المشكلة.','نسخ المثال دون تجربة تغييرات.','عدم مراجعة النتيجة.','تجاهل أخطاء البيانات أو الإدخال.'].map(x=>`<p>⚠️ ${x}</p>`).join('');$('terms').innerHTML=[topic,'Input','Process','Output','Validation'].map(x=>`<span style="display:inline-block;margin:4px;padding:7px 11px;border-radius:999px;background:rgba(59,130,246,.12)">${x}</span>`).join('');const qs=[`ما الهدف الأساسي من ${topic}؟`,`ما أول خطوة صحيحة قبل التطبيق؟`,`ما أفضل طريقة للتأكد أن النتيجة صحيحة؟`,`ماذا تفعل إذا ظهرت نتيجة غير متوقعة؟`,`كيف تستخدم ${topic} في مشروع حقيقي؟`];$('quiz').innerHTML=qs.map((q,i)=>`<div><b>${i+1}. ${q}</b><label class="opt"><input type="radio" name="q${i}" value="1"> أفهم الهدف وأطبق وأتحقق من النتيجة</label><label class="opt"><input type="radio" name="q${i}" value="0"> أنسخ أي مثال دون اختبار</label></div>`).join('');$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('submit').onclick=async()=>{let score=0;for(let i=0;i<5;i++){if(document.querySelector(`input[name=q${i}]:checked`)?.value==='1')score+=20}$('result').textContent=`نتيجتك: ${score}%`;if(score>=60){$('result').style.color='#4ade80';$('complete').disabled=false;await MIS.saveQuiz(slug,level,lesson,score)}else{$('result').style.color='#f87171';$('complete').disabled=true}};$('complete').onclick=async()=>{const r=await MIS.completeLesson(slug,level,lesson);if(r.ok){alert('تم إكمال الدرس بنجاح ✓');location.href=`course.html?course=${encodeURIComponent(slug)}`}else alert('تعذر حفظ الدرس: '+(r.error||'LOGIN_REQUIRED'))}}catch(e){console.error(e);$('loading').innerHTML='<h2>❌ تعذر تحميل الدرس</h2><p>حدّث الصفحة وحاول مرة أخرى.</p>'}})();</script></body></html>
