<!doctype html><html lang="ar" dir="rtl"><head><base href="/MIS-Career-Hub-7/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحساب | MIS Career Hub</title><link rel="stylesheet" href=assets/app.css"></head><body><header class="top"><div class="wrap"><div class="brand">MIS Career Hub</div><nav class="nav"><a href=index.html">الرئيسية</a><a href="courses.html">الكورسات</a></nav></div></header><main class="wrap"><section class="hero"><span class="pill">Student Account</span><h1>ابدأ رحلتك المهنية</h1><p>أنشئ حسابك واحفظ تقدمك ونتائجك وشهاداتك.</p></section><div class="authbox"><div id="msg" class="notice"></div><label>الاسم الكامل<input id="name" placeholder="اكتب اسمك"></label><label>البريد الإلكتروني<input id="email" type="email" placeholder="name@example.com"></label><label>كلمة المرور<input id="password" type="password" placeholder="6 أحرف أو أكثر"></label><div class="actions"><button class="btn" onclick="signup()">إنشاء حساب</button><button class="btn secondary" onclick="signin()">تسجيل الدخول</button></div><hr><button class="oauth" onclick="oauth('google')">المتابعة باستخدام Google</button><button class="oauth" onclick="oauth('facebook')">المتابعة باستخدام Facebook</button><label>رقم الهاتف<input id="phone" placeholder="+201..." dir="ltr"></label><button class="oauth" onclick="phoneOtp()">إرسال رمز OTP</button><div id="otpWrap" hidden><label>رمز التحقق<input id="otp" placeholder="123456"></label><button class="btn" onclick="verifyOtp()">تأكيد الرمز</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script src=assets/app.js"></script><script>
async function signup(){if(!sb)return MIS.msg('أضف بيانات Supabase في config.js أولًا',false);let {error}=await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value},emailRedirectTo:location.origin+"/MIS-Career-Hub-7/student/dashboard.html"}});MIS.msg(error?error.message:'تم إنشاء الحساب. راجع بريدك لتأكيد الحساب.',!error)}
async function signin(){if(!sb)return MIS.msg('أضف بيانات Supabase أولًا',false);let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return MIS.msg(error.message,false);let p=await MIS.profile();location.href=p&&['owner','admin'].includes(p.role)?'/admin/dashboard.html':'/student/dashboard.html'}
async function oauth(provider){if(!sb)return MIS.msg('أضف بيانات Supabase أولًا',false);let {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+"/MIS-Career-Hub-7/student/dashboard.html"}});if(error)MIS.msg(error.message,false)}
async function phoneOtp(){if(!sb)return MIS.msg('أضف بيانات Supabase أولًا',false);let {error}=await sb.auth.signInWithOtp({phone:phone.value});if(error)return MIS.msg(error.message,false);otpWrap.hidden=false;MIS.msg('تم إرسال رمز التحقق.')}
async function verifyOtp(){let {error}=await sb.auth.verifyOtp({phone:phone.value,token:otp.value,type:'sms'});if(error)return MIS.msg(error.message,false);location.href='/student/dashboard.html'}
</script></body></html>
