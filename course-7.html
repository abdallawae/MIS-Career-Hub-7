<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIS Career Hub | مسار 7 مستويات</title><link rel="stylesheet" href="assets/app.css"></head><body><main class="section"><div class="wrap"><section id="gate" class="hero" hidden><h1>🔐 سجّل الدخول لبدء التعلم</h1><a id="login" class="btn">تسجيل الدخول</a></section><section id="app" hidden><div class="hero"><span class="eyebrow">📚 مسار علمي مكثف</span><h1 id="title"></h1><p id="desc" class="muted"></p><div class="card"><strong>7 مستويات • 20 درسًا شاملًا</strong><div id="count" class="muted"></div><div class="bar"><i id="fill"></i></div></div><div id="resume" class="card"></div></div><div id="levels"></div></section><p id="status" class="notice"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js?v=20260920"></script><script src="assets/supabase-client.js?v=20260920"></script><script src="assets/course-content.js?v=20260920"></script><script src="assets/track-content.js?v=20260920"></script><script src="assets/rich-excel-content.js?v=20260920"></script><script src="assets/course-structure-7.js?v=20260930"></script><script>(async()=>{const p=new URLSearchParams(location.search),slug=p.get('course')||'sql',names={sql:'SQL وقواعد البيانات',excel:'Excel الاحترافي','power-bi':'Power BI','systems-analysis':'تحليل وتصميم النظم',erp:'ERP',python:'Python وتحليل البيانات',web:'تطوير الويب',cybersecurity:'الأمن السيبراني',cloud:'الحوسبة السحابية','project-management':'إدارة المشروعات',career:'المسار الوظيفي','digital-transformation':'التحول الرقمي'};try{const s=(await sb.auth.getSession()).data.session;if(!s){gate.hidden=false;login.href='auth.html?next='+encodeURIComponent(location.pathname+location.search);return}app.hidden=false;const c=MIS_COURSE_CONTENT_7?.[slug]||MIS_CURRICULUM_20?.[slug]||MIS_TRACK_CONTENT_7?.[slug];if(!c)throw Error('المسار غير موجود');title.textContent=names[slug]||slug;desc.textContent=c.intro||'مسار علمي مكثف يجمع الفهم والتطبيق والمشروعات.';let pr=[];try{pr=await MIS.getProgress(slug)||[];await MIS.enroll(slug)}catch(e){}const done=(l,i)=>pr.some(x=>+x.level_number===l&&+x.lesson_number===i);count.textContent=`${pr.length} / 20 درس مكتمل`;fill.style.width=Math.min(100,pr.length/20*100)+'%';const levelNames=c.levelNames||['الأساسيات وبناء الصورة الكبيرة','المفاهيم والأدوات الأساسية','التطبيق العملي والتحليل','حل المشكلات واتخاذ القرار','المهارات المتقدمة','الممارسة المهنية','الإتقان والمشروع النهائي'];levels.innerHTML=c.levels.map((arr,l)=>`<section class="card" style="margin-top:18px"><h2>المستوى ${l+1} — ${levelNames[l]} <small>(${arr.length} دروس)</small></h2>${arr.map((t,i)=>{const title=Array.isArray(t)?t[0]:t,ok=done(l+1,i+1);return `<a href="lesson.html?course=${encodeURIComponent(slug)}&level=${l+1}&lesson=${i+1}" class="card" style="display:block;margin:8px 0;text-decoration:none"><b>${ok?'✓ ':''}${i+1}. ${title}</b><div class="muted">شرح علمي مكثف + مثال + تطبيق + أخطاء + تحدي + اختبار</div></a>`}).join('')}</section>`).join('');let next=null;for(let l=0;l<c.levels.length&&!next;l++)for(let i=0;i<c.levels[l].length;i++)if(!done(l+1,i+1)){next={l:l+1,i:i+1};break}resume.innerHTML=next?`🎯 <b>استكمل من المستوى ${next.l} — الدرس ${next.i}</b>`:'🏆 أكملت المسار بالكامل!';if(next)resume.onclick=()=>location.href=`lesson.html?course=${encodeURIComponent(slug)}&level=${next.l}&lesson=${next.i}`;}catch(e){status.textContent='حدث خطأ أثناء تحميل المسار.';console.error(e)}})();</script></body></html>
