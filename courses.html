<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسارات التعليمية | MIS Career Hub</title><meta name="description" content="استكشف 12 مسارًا تعليميًا في MIS Career Hub، مع 7 مستويات و20 درسًا واختبارات وتطبيقات ومشروع نهائي."><link rel="stylesheet" href="assets/app.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="student-dashboard.html">لوحة الطالب</a><a href="auth.html">حسابي</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap"><div class="hero" style="padding:25px 0 35px"><span class="eyebrow">📚 مكتبة المهارات</span><h1>اختار مسارك وابدأ من الصفر</h1><p class="muted">12 مسارًا · كل مسار 7 مستويات · 20 درسًا · شرح وتطبيق واختبار ومشروع نهائي.</p></div><input id="courseSearch" class="search" placeholder="ابحث عن SQL أو Power BI أو Python..." aria-label="البحث في المسارات"><div style="height:22px"></div><div class="grid" id="courseGrid"></div></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script>const courses=[['sql','💾','SQL وقواعد البيانات','ابنِ قواعد بيانات حقيقية وتعلم الاستعلامات والتحليل.'],['excel','📊','Excel الاحترافي','الدوال والتنظيف وPivotTables ولوحات التحكم.'],['power-bi','📈','Power BI','حوّل البيانات إلى تقارير تفاعلية وقرارات مبنية على الأرقام.'],['systems-analysis','🧩','تحليل وتصميم النظم','المتطلبات وUML وSDLC وتصميم الحلول.'],['erp','🏢','ERP','افهم عمليات الشركات وأنظمة ERP وربط الأقسام.'],['python','🐍','Python وتحليل البيانات','Python وPandas وتنظيف وتحليل البيانات.'],['web','🌐','تطوير الويب','HTML وCSS وJavaScript وبناء تطبيقات ويب.'],['cybersecurity','🔐','الأمن السيبراني','الحماية والمخاطر والشبكات والوعي الأمني.'],['cloud','☁️','الحوسبة السحابية','مفاهيم السحابة والبنية والخدمات والتطبيقات.'],['project-management','📋','إدارة المشروعات','التخطيط والتنفيذ والمتابعة وAgile.'],['career','🚀','المسار الوظيفي','CV وLinkedIn وPortfolio والمقابلات.'],['digital-transformation','⚡','التحول الرقمي','الاستراتيجية والأتمتة والبيانات وإدارة التغيير.']];const grid=document.getElementById('courseGrid');function render(a=courses){grid.innerHTML=a.map(x=>`<article class="course-card"><div class="course-top"><div class="course-icon">${x[1]}</div><span class="pill">7 مستويات · 20 درس</span></div><h3>${x[2]}</h3><p>${x[3]}</p><div class="course-meta"><span>شرح</span><span>تطبيق</span><span>اختبار</span></div><a class="btn small" href="course.html?course=${x[0]}">ابدأ المسار ←</a></article>`).join('')}render();courseSearch.oninput=e=>{const q=e.target.value.trim().toLowerCase();render(courses.filter(x=>(x[2]+' '+x[3]+' '+x[0]).toLowerCase().includes(q)))};document.querySelector('[data-year]').textContent=new Date().getFullYear();</script></body></html>
