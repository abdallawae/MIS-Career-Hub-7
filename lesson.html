<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرس | MIS Career Hub</title><link rel="stylesheet" href="assets/app.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">MIS <span>Career Hub</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="courses.html">المسارات</a><a href="career-roadmap.html">خارطة الطريق</a><a href="auth.html">حسابي</a><a href="owner.html">Owner</a></nav></div></header><main class="section"><div class="wrap"><article class="hero" id="lesson"><span class="eyebrow" id="level"></span><h1 id="title">جاري تحميل الدرس...</h1><p class="muted" id="intro"></p></article><section class="card lesson-content"><h2>🎯 هدف الدرس</h2><p id="goal"></p><h2>📘 الشرح</h2><p id="concept"></p><h2>🛠️ تطبيق عملي</h2><div class="codebox" id="example"></div><h2>🧠 اختبر نفسك</h2><div id="quiz"></div><button class="btn" id="complete">إكمال الدرس ✓</button><a class="btn secondary" id="back" href="#">العودة للمسار</a></section></div></main><footer class="footer"><div class="wrap">MIS Career Hub © <span data-year></span></div></footer><script>const C={sql:['SQL وقواعد البيانات','تعلم كيف تمثل البيانات وتستخرج منها إجابات دقيقة باستخدام SQL.'],excel:['Excel الاحترافي','حوّل البيانات الخام إلى جداول وتقارير قابلة للتحليل.'],'power-bi':['Power BI','ابنِ نموذج بيانات وتقريرًا تفاعليًا يساعد في اتخاذ القرار.'], 'systems-analysis':['تحليل وتصميم النظم','حلل احتياج المؤسسة وحوله إلى متطلبات وحل منظم.'],erp:['ERP','اربط عمليات المبيعات والمخزون والحسابات داخل تصور ERP.'],python:['Python وتحليل البيانات','استخدم Python لمعالجة البيانات واستخراج مؤشرات منها.'],web:['تطوير الويب','افهم مكونات صفحة الويب وابنِ واجهة منظمة.'],cybersecurity:['الأمن السيبراني','تعرف على المخاطر الأمنية وكيف تقلل سطح الهجوم.'],cloud:['الحوسبة السحابية','افهم الموارد والخدمات السحابية ومتى تستخدمها.'],'project-management':['إدارة المشروعات','حوّل الهدف إلى نطاق وخطة ومهام قابلة للمتابعة.'],career:['المسار الوظيفي','حوّل مهاراتك إلى CV وPortfolio وخطة تقديم قوية.'],'digital-transformation':['التحول الرقمي','اربط التقنية بالعمليات والبيانات وأهداف المؤسسة.']};const q=new URLSearchParams(location.search),slug=q.get('course')||'sql',lv=+q.get('level')||1,ls=+q.get('lesson')||1,d=C[slug]||C.sql;const lessonTypes=['المفهوم الأساسي','الأداة والواجهة','خطوات العمل','تطبيق واقعي','الأخطاء الشائعة','تحدي ومراجعة'];const type=lessonTypes[ls-1];title.textContent=`الدرس ${ls}: ${type} — ${d[0]}`;level.textContent=`المستوى ${lv} · الدرس ${ls} من 6`;intro.textContent=d[1];goal.textContent=`بنهاية الدرس تكون قادرًا على شرح ${type.toLowerCase()} وتطبيقه على مثال صغير بدل الحفظ فقط.`;concept.textContent=`ابدأ بفهم الفكرة، ثم حدد المدخلات والنتيجة المطلوبة، وبعدها نفّذ خطوة بخطوة. في ${d[0]} ركّز على سبب استخدام الأداة قبل حفظ الأوامر؛ هذا الأسلوب يحول المعرفة إلى مهارة يمكن استخدامها في مشروع حقيقي.`;example.textContent=`سيناريو عملي:\nلديك بيانات مؤسسة صغيرة. حدّد المشكلة أولًا، اختر البيانات التي تحتاجها، نفّذ خطوة واحدة، راجع النتيجة، ثم حسّن الحل.\n\nمهمتك: اكتب بيدك الحل أو الخطوات، ثم قارن النتيجة بالمطلوب.`;quiz.innerHTML=`<p><strong>ما أفضل طريقة للتعلم؟</strong></p><label><input type="radio" name="a" value="1"> حفظ المصطلحات فقط</label><br><label><input type="radio" name="a" value="2"> فهم الفكرة ثم تطبيقها واختبارها</label><br><label><input type="radio" name="a" value="3"> مشاهدة الشرح دون تنفيذ</label><p id="feedback"></p>`;complete.onclick=()=>{let k='misch_'+slug,x=JSON.parse(localStorage.getItem(k)||'[]'),id=`${lv}-${ls}`;if(!x.includes(id))x.push(id);localStorage.setItem(k,JSON.stringify(x));complete.textContent='تم حفظ تقدمك ✓';};document.querySelectorAll('input[name=a]').forEach(e=>e.onchange=()=>feedback.textContent=e.value==='2'?'إجابة صحيحة ✓':'حاول مرة أخرى — التطبيق أهم من الحفظ.');back.href=`course.html?course=${slug}`;document.querySelector('[data-year]').textContent=new Date().getFullYear();</script></body></html>
